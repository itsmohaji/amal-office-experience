<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#101319"><title>AMAL | DBU Group Experience</title><style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#080e14;color:#fff;font-family:Manrope,sans-serif;overflow:hidden}button{font:inherit;cursor:pointer}.app{position:relative;height:100dvh;overflow:hidden;isolation:isolate;background:#121b21}.scene{position:absolute;inset:-8%;background-image:linear-gradient(90deg,#07101870,transparent 45%,#080e1640),url('https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=2400&q=85');background-position:center;background-size:cover;transform:translate3d(var(--pan,0%),0,0) scale(var(--zoom,1.12));filter:brightness(var(--light,.8)) saturate(.75) sepia(.11);transition:transform 1.3s cubic-bezier(.2,.8,.2,1),filter 1.2s}.app.night .scene{filter:brightness(.37) saturate(.63) hue-rotate(10deg)}.shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 55% 35%,transparent 15%,#07111a65 90%),linear-gradient(0deg,#080f18ec,transparent 37%,#07111a80)}.glow{position:absolute;inset:0;background:radial-gradient(ellipse at 70% 50%,#d5a76324,transparent 40%);pointer-events:none;mix-blend-mode:screen}.top{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;padding:24px;display:flex;justify-content:space-between;align-items:start;gap:15px}.brand{font-size:17px;letter-spacing:.28em;font-weight:700}.sub{display:block;color:#c4b49a;font-size:9px;letter-spacing:.23em;margin-top:5px}.controls{display:flex;gap:8px}.btn{border:1px solid #ffffff50;border-radius:100px;background:#141b2099;backdrop-filter:blur(20px);color:white;padding:11px 14px;font-size:11px}.welcome{position:absolute;bottom:max(95px,calc(env(safe-area-inset-bottom) + 82px));left:7%;width:min(430px,84%);text-shadow:0 2px 15px #0008}.eyebrow{font-size:10px;letter-spacing:.3em;color:#e7bf80}.welcome h1{font-size:clamp(36px,6vw,78px);font-weight:400;letter-spacing:-.06em;line-height:1.06;margin:15px 0}.welcome p{font-size:13px;line-height:1.9;color:#e3e0d8}.welcome button{background:#d7b581;border:0;color:#191a1b;padding:14px 22px;margin-top:14px;border-radius:30px;font-size:12px;font-weight:700}.bottom{position:absolute;bottom:0;left:0;right:0;padding:16px 18px calc(env(safe-area-inset-bottom) + 15px);display:flex;gap:8px;justify-content:center;background:linear-gradient(transparent,#081017c0)}.bottom button{flex:1;max-width:145px;background:#f5f1e916;border:1px solid #f5f1e938;color:#fff;border-radius:12px;padding:13px 5px;font-size:11px;backdrop-filter:blur(20px)}.hot{position:absolute;top:42%;right:16%;width:78px;height:78px;border:1px solid #e6c590a0;border-radius:50%;display:grid;place-items:center;background:#1a243077;box-shadow:0 0 0 12px #e6c59018,0 0 45px #f1c27b30;color:#fff;font-size:11px;letter-spacing:.12em;animation:breathe 3s ease-in-out infinite alternate}@keyframes breathe{to{box-shadow:0 0 0 22px #e6c59008,0 0 55px #f1c27b40}}.panel{position:absolute;right:15px;left:15px;bottom:max(84px,calc(env(safe-area-inset-bottom) + 72px));background:#0c1522e8;border:1px solid #d3b48c66;box-shadow:0 20px 100px #0009;border-radius:20px;backdrop-filter:blur(30px);padding:25px;transform:translateY(125%);transition:transform .6s cubic-bezier(.17,.8,.2,1);max-width:460px;margin-left:auto}.panel.open{transform:translateY(0)}.panel h2{font-size:25px;font-weight:400;margin:9px 0}.panel p{font-size:13px;line-height:1.8;color:#d5d2cb}.panel small{letter-spacing:.2em;color:#d7b581}.panel .close{float:right;background:transparent;border:0;color:white;font-size:23px}.hint{position:absolute;top:17%;left:50%;transform:translateX(-50%);color:#ffffffb0;font-size:11px;white-space:nowrap}@media(min-width:900px){.panel{right:6%;left:auto;width:430px}.welcome{bottom:22%}.hot{right:28%;top:46%}}@media(max-width:430px){.brand{font-size:14px}.top{padding:22px 16px}.controls .btn{padding:9px}.hot{right:12%;top:37%}}
</style></head><body><div class="app" id="app"><div class="scene" id="scene"></div><div class="glow"></div><div class="shade"></div><div class="hint">← Drag to explore the room →</div><header class="top"><div class="brand">AMAL<span class="sub">A DBU GROUP EXPERIENCE</span></div><div class="controls"><button class="btn" id="light">☾ Night</button><button class="btn" id="reset">Reset</button></div></header><button class="hot" id="amal">MEET<br>AMAL</button><section class="welcome" id="welcome"><div class="eyebrow">WELCOME TO OUR WORLD</div><h1>Beyond the<br>ordinary.</h1><p>Explore the world of DBU Group through an immersive, cinematic experience. Strategy, technology, and growth — one perspective.</p><button id="start">Enter the experience ↗</button></section><div class="panel" id="panel"><button class="close" id="close">×</button><small id="label">EXPLORE</small><h2 id="title">Welcome</h2><p id="body"></p></div><nav class="bottom"><button data-topic="strategy">Strategy ↗</button><button data-topic="technology">Technology ↗</button><button data-topic="growth">Growth ↗</button><button data-topic="amal">Talk to AMAL ↗</button></nav></div><script>
const app=document.getElementById('app'),panel=document.getElementById('panel'),title=document.getElementById('title'),body=document.getElementById('body'),label=document.getElementById('label'),scene=document.getElementById('scene');
let pan=0,zoom=1.12,down=null;
const topics={strategy:['ADVISORY','Strategy & Advisory','A considered perspective on complex business decisions, market opportunities and long-term value.'],technology:['INNOVATION','Technology World','Explore how technology, digital experiences and intelligent systems can shape what comes next.'],growth:['GROWTH','Growth & Markets','New markets. Distinctive brands. Stronger business opportunities.'],amal:['YOUR GUIDE','Meet AMAL','I am AMAL, your guide to the world of DBU Group. Discover our thinking, expertise and digital possibilities. This prototype is a cinematic interaction demo, not a live AI conversation.']};
function openTopic(k){const t=topics[k];label.textContent=t[0];title.textContent=t[1];body.textContent=t[2];panel.classList.add('open');pan=k==='technology'?-2:k==='growth'?3:k==='amal'?1:0;zoom=1.19;apply();document.getElementById('welcome').style.opacity='.15'}
function apply(){app.style.setProperty('--pan',pan+'%');app.style.setProperty('--zoom',zoom)}
document.querySelectorAll('[data-topic]').forEach(b=>b.addEventListener('click',()=>openTopic(b.dataset.topic)));
document.getElementById('amal').onclick=()=>openTopic('amal');document.getElementById('start').onclick=()=>openTopic('strategy');
document.getElementById('close').onclick=()=>panel.classList.remove('open');
document.getElementById('light').onclick=e=>{app.classList.toggle('night');e.target.textContent=app.classList.contains('night')?'☀ Dusk':'☾ Night'};
document.getElementById('reset').onclick=()=>{pan=0;zoom=1.12;apply();panel.classList.remove('open');document.getElementById('welcome').style.opacity='1'};
scene.addEventListener('pointerdown',e=>{down={x:e.clientX,pan};scene.setPointerCapture(e.pointerId)});scene.addEventListener('pointermove',e=>{if(!down)return;pan=Math.max(-7,Math.min(7,down.pan+(e.clientX-down.x)/25));apply()});scene.addEventListener('pointerup',()=>down=null);scene.addEventListener('pointercancel',()=>down=null);
</script></body></html>
